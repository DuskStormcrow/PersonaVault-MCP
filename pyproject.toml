[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personavault-mcp"
version = "0.1.0"
description = "Host-neutral MCP adapter for PersonaVault. Slice 3: two tools registered — get_boot_context (read-only) and propose_session_note (write-adjacent, proposal-only) — no transport, no auth, no third tool yet."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/personavault_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
